name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type Check
        run: pnpm type-check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          VITE_SITE_PUBLIC_GITHUB_CONTRIBUTIONS_API_URL: "https://github-contributions-api.jogruber.de/v4"
          VITE_IMAGEKIT_URL_ENDPOINT: "https://ik.imagekit.io/placeholder"
          VITE_IMAGEKIT_PUBLIC_KEY: "public_placeholder"
          IMAGEKIT_PRIVATE_KEY: "private_placeholder"
          DATABASE_URL: "postgresql://placeholder:placeholder@placeholder.neon.tech/neondb?sslmode=require"
          RESEND_API_KEY: "re_placeholder"
